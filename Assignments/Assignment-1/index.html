<!DOCTYPE html>

<html lang="en">


<!--  Allowes the webpage to be displayed / scaled correctly.  -->
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <title> My Transformers Fan Page </title>
    <link rel = "stylesheet" href = "style.css">
</head>

<body>

    <!-- Welcome Banner thats displayed on the top of my page  -->
    <header class = "siteHeader">
        <h1>Welcome to My Transformers Fan Page~!</h1>
    </header>

    <!-- The sidebar and content page -->
    <div class = "pageLayout">

        <!-- Navigation bar for the 5 pages -->
        <nav class = "sidebar">
            <a href = "index.html">Home Page</a>
            <a href = "favorites.html">My Top 10 Transformers</a>
            <a href = "movies.html">My Favorite Transformers Movies</a>
            <a href = "gallery.html">Gallery</a>
            <a href = "tribute.html">Tribute</a>
        </nav>

        <!-- Main homepage content -->
        <main class = "mainContent">

            <!-- Short intro to the website -->
            <p class = "intro">
                Welcome to my Transformers Fan Page website! Feel free to explore my favorite characters, movies, and pictures.
            </p>

            <!-- Autobot and Decepticon logos on the front home page -->
            <div class = "logos">

                <figure class = "autobotPic">

                    <img
                        src = "https://cdn.archonia.com/images/1-40776603-1-1-original1/transformers-autobot-logo-magnet.jpg"
                    >

                    <figcaption>AUTOBOTS</figcaption>
                </figure>

                <figure class = "decepticonPic">
                    <img
                        src = "https://i.ebayimg.com/images/g/PWAAAMXQkK1R5Gi~/s-l400.jpg"
                    >

                    <figcaption>DECEPTICONS</figcaption>
                </figure>

            </div>

            <!-- Optimus Prime quote -->
            <div class="quoteSection">
                <p>
                    "Freedom is the right of all sentient beings" - Optimus Prime
                </p>
            </div>

        </main>

    </div>

</body>
</html>
