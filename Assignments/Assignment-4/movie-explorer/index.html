  The single HTML page for the app. React renders everything inside the
  <div id="root"> element, starting from src/main.jsx. The viewport meta tag
  makes the page fit phone screens instead of showing a zoomed-out desktop view.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse popular movies and search TMDB for any title." />
    <title>Movie Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
